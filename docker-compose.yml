# Under `services.<name>`, only valid Compose keys are allowed.
# For a fixed container name use `container_name`, not `name`.
services:
  bot:
    name: hugging-face-news-bot:latest
    build: .
    env_file: .env
    environment:
      - ARCHIVE_PATH=/app/data/news_archive.jsonl
      - DEDUPE_INDEX_PATH=/app/data/dedupe_index.json
    volumes:
      - bot-data:/app/data
    restart: unless-stopped

volumes:
  bot-data:
